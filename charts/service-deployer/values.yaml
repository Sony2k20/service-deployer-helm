fullnameOverride: service-deployer

replicaCount: 1

# updateStrategy: Recreate

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: latest

commands:
  enabled: false
#   command: ["/bin/sh", "-c"]
#   args: ["sleep infinity"]

# env:
#   KEY: value

# secretRef: secretNmae

hostNetwork: false

securityContext:
  enabled: false
  runAsUser: 1000
  runAsGroup: 100
  fsGroup: 100

dailyRestart:
  enabled: false
  schedule: "0 5 * * *" # At 5:00 AM daily

service:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
      # nodePort: 30000

ingress:
  enabled: false
  host: service.csnguyen.de
  ingressClassName: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: |
      kube-system-redirect-https@kubernetescrd
  path: /
  pathType: Prefix
  serviceName: http
  tlsSecret: csnguyen-tls

# Alternative to ingress: Traefik's native IngressRoute CRD.
# Requires the Traefik CRDs to be installed in the cluster.
ingressRoute:
  enabled: false
  annotations: {}
  entryPoints:
    - websecure
  host: service.csnguyen.de
  path: /
  servicePort: http
  middlewares:
    - name: redirect-https
      namespace: kube-system
  tls:
    secretName: csnguyen-tls

startupProbe:
#   httpGet:
#     path: /
#     port: 80

persistentVolume:
  # - name: config
  #   mountPath: /config
  #   subPath:

# A ConfigMap with one key per file, mounted as a volume (named {{ fullname }}-files).
# Reference it yourself via volumes/volumeMounts.
fileConfigMap:
  enabled: false
  data: {}
  #   settings.yaml: |
  #     title: Example

serviceAccount:
  create: false
  name: ""

# Cluster-scoped RBAC for the pod's serviceAccount.
# Set serviceAccount.create: false + serviceAccount.name to reuse an existing one instead.
rbac:
  enabled: false
  rules: []
  #   - apiGroups: [""]
  #     resources: ["namespaces", "pods", "nodes"]
  #     verbs: ["get", "list"]

resources:
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi

initContainers: []
